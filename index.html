    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <script>
      // Gracefully silence expected development WebSocket sandbox connection warnings
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            try {
              const ws = new OriginalWebSocket(url, protocols);
              ws.addEventListener('error', () => { /* Silence benign iframe HMR connection errors */ });
              return ws;
            } catch (e) {
              return {
                addEventListener: () => {},
                removeEventListener: () => {},
                close: () => {},
                send: () => {}
              };
            }
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-50 antialiased selection:bg-brand-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
